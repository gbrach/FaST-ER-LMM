[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fasterlmm"
version = "0.1.0"
description = "torch port of FaST-LMM (Lippert et al. 2011), work in progress"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "pysnptools",
]

[tool.setuptools.packages.find]
where = ["src"]
