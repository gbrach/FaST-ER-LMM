[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fasterlmm"
dynamic = ["version"]
description = "torch port of FaST-LMM (Lippert et al. 2011, Nat. Methods)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "gbrach", email = "gbrach@users.noreply.github.com" }]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "pysnptools",
    "torch",
    "tqdm",
    "rich",
    "pyarrow",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# Portable CPU suite; pypdf checks generated plots without external viewers.
test = ["pytest>=7", "pytest-cov", "pypdf>=3"]
# fastlmm is only needed to rebuild the parity golden + run the fastlmm-external low-rank check
parity = ["fastlmm"]
# Kept for existing figure-generation install commands; plotting now ships by default.
figures = ["matplotlib>=3.7"]

[project.scripts]
fasterlmm = "fasterlmm.cli_main:main"
gwas-epi = "fasterlmm_lux.epi.cli:main"
epi-watch = "fasterlmm_lux.epi.watch:main"

[project.urls]
Repository = "https://github.com/gbrach/FaST-ER-LMM"
Issues = "https://github.com/gbrach/FaST-ER-LMM/issues"

[tool.setuptools.package-dir]
fasterlmm = "src/fasterlmm"
fasterlmm_lux = "lux/src/fasterlmm_lux"

[tool.setuptools.packages.find]
where = ["src", "lux/src"]
include = ["fasterlmm", "fasterlmm.*", "fasterlmm_lux", "fasterlmm_lux.*"]
namespaces = false

[tool.setuptools.dynamic]
version = { attr = "fasterlmm.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests", "lux/tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["fasterlmm"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
