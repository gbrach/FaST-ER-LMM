[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fasterlmm"
version = "1.0.0"
description = "torch port of FaST-LMM (Lippert et al. 2011, Nat. Methods)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "pysnptools",
    "torch",
    "tqdm",
    "rich",
    "pyarrow",
]

[project.scripts]
fasterlmm = "fasterlmm.cli_main:main"

[tool.setuptools.packages.find]
where = ["src"]
